# Cloudflare Pages project: static Next.js export in `out/` plus Pages Functions in `functions/`.
# No secrets in this file. Secrets go in `.dev.vars` locally (see .dev.vars.example) and in the
# Pages project settings (Settings → Variables and Secrets) in production.
name = "karakoram-trails"
pages_build_output_dir = "out"
compatibility_date = "2026-09-01"

# Non-secret settings read by the Pages Functions (production and preview). Secrets are set with
#   npx wrangler pages secret put NAME --project-name karakoram-trails
# Locally, .dev.vars overrides these.
[vars]
DEPOSIT_PERCENT = "30"
HOLD_HOURS = "48"
TURNSTILE_HOSTNAMES = "karakoram-trails.pages.dev"
PUBLIC_SITE_URL = "https://karakoram-trails.pages.dev"

# Production D1 (created with `npx wrangler d1 create karakoram-trails`). The id is not a secret.
[[d1_databases]]
binding = "DB"
database_name = "karakoram-trails"
database_id = "afdfabff-a9c9-4a3d-9e2c-543b1cf6be8d"
migrations_dir = "migrations"

# Receipts bucket (used from stage 2). Create once with:
#   npx wrangler r2 bucket create karakoram-trails-receipts
[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "karakoram-trails-receipts"
